<!doctype html>
<!-- Build assertion for aidar-avatar.png, read by build_og.sh.
     Scans the exported PNG's pixels for the bounding box of everything darker
     than the white field and reports it in the document title. Exists because
     the first export was rendered straight from the .svg URL, where Chrome
     scaled it to the viewport and pushed the plate off the right edge — the SVG
     was inspected at six sizes and looked perfect, but nobody looked at the
     artifact. Checking the source is not checking the output. -->
<html lang="en">
  <head><meta charset="utf-8"></head>
  <body>
    <script>
      addEventListener('load', () => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = img.width;
          c.height = img.height;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const d = ctx.getImageData(0, 0, c.width, c.height).data;
          let minX = Infinity, minY = Infinity, maxX = -1, maxY = -1;
          for (let y = 0; y < c.height; y++) {
            for (let x = 0; x < c.width; x++) {
              const i = (y * c.width + x) * 4;
              if (d[i] < 245 || d[i + 1] < 245 || d[i + 2] < 245) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
          }
          const clipped = [];
          if (minX <= 0) clipped.push('left');
          if (minY <= 0) clipped.push('top');
          if (maxX >= c.width - 1) clipped.push('right');
          if (maxY >= c.height - 1) clipped.push('bottom');
          document.title = JSON.stringify({
            size: `${c.width}x${c.height}`,
            margins: { l: minX, t: minY, r: c.width - 1 - maxX, b: c.height - 1 - maxY },
            clipped,
          });
        };
        img.onerror = () => { document.title = JSON.stringify({ error: 'avatar failed to load' }); };
        img.src = 'aidar-avatar.png';
      });
    </script>
  </body>
</html>
