<!doctype html>
<!-- Source for both share cards, rendered at exactly 1200x630 by build_og.sh:
       (no query)      -> aidar-og.png         the clean card
       ?variant=lineup -> aidar-og-lineup.png  the same card carrying the programme

     One source, two variants, so the wordmark and typography can never drift
     apart between them. Edit here, re-run that script, never hand-edit a PNG. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      :root {
        --ink: #202124;
        --muted: #5f6368;
        --line: #d8dadd;
        --wash: #f7f8f8;
        --accent: #2f6f73;
        --accent-deep: #26595c;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; padding: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fff;
        color: var(--ink);
        font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      }

      /* The plate: a hairline frame inset from the trim, as a figure in a journal. */
      .plate {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 64px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, #fff 0%, var(--wash) 100%);
        outline: 14px solid #fff;
        outline-offset: -14px;
        text-align: center;
      }

      .kicker {
        margin: 0 0 30px;
        color: var(--accent);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      /* The lockup: the A is the Eiffel Tower, so the I beside it reads AI. */
      .wordmark {
        display: flex;
        align-items: baseline;
        justify-content: center;
        margin: 0;
        font-size: 172px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .wordmark .tower {
        display: block;
        width: 0.71em;
        height: 0.7em;      /* cap height of the letters that follow */
        margin-right: 0.008em;
      }

      .wordmark .tower img { display: block; width: 100%; height: 100%; }

      .wordmark .lower { font-style: italic; }

      .rule {
        width: 148px;
        height: 2px;
        margin: 34px 0 26px;
        background: var(--accent-deep);
      }

      .tagline {
        margin: 0;
        font-size: 40px;
        line-height: 1.15;
        letter-spacing: -0.01em;
      }

      .footline {
        position: absolute;
        right: 64px;
        bottom: 46px;
        left: 64px;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 19px;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .footline b { color: var(--ink); font-weight: 700; }

      /* The programme only exists on the lineup variant. */
      .programme { display: none; }

      /* Four portraits in a fixed 630px leaves room for the affiliations, so
         the card carries who is speaking and where they are from. */
      body.lineup .plate { justify-content: flex-start; padding-top: 36px; }
      body.lineup .kicker { margin-bottom: 12px; font-size: 16px; }
      body.lineup .wordmark { font-size: 132px; }
      body.lineup .rule { margin: 12px 0 10px; width: 116px; }
      body.lineup .tagline { font-size: 24px; }
      body.lineup .programme { display: block; width: 100%; margin-top: 20px; }

      .group + .group { margin-top: 14px; }

      .group h2 {
        margin: 0 0 8px;
        color: var(--accent);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .strip {
        display: flex;
        justify-content: center;
        gap: 26px;
      }

      .strip figure { width: 192px; margin: 0; }

      /* Matches the portraits on the site: hairline, 8px radius, square crop. */
      .strip img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        border: 1px solid var(--line);
        border-radius: 8px;
        object-fit: cover;
        background: var(--wash);
        filter: saturate(0.96);
      }

      .strip figcaption {
        margin-top: 10px;
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
      }

      .strip .where {
        display: block;
        margin-top: 1px;
        color: var(--muted);
        font-weight: 400;
      }

    </style>
  </head>
  <body>
    <div class="plate">
      <p class="kicker">NeurIPS 2026 Workshop</p>
      <h1 class="wordmark">
        <span class="tower"><img src="aidar-a.svg" alt=""></span>ID<span class="lower">a</span>R
      </h1>
      <div class="rule"></div>
      <p class="tagline">AI Data Readiness for Scientific Discovery</p>

      <div class="programme">
        <div class="group">
          <h2>Invited speakers</h2>
          <div class="strip">
            <figure>
              <img src="../speakers/max-welling.jpg" alt="">
              <figcaption>Max Welling<span class="where">University of Amsterdam</span></figcaption>
            </figure>
            <figure>
              <img src="../speakers/marianna-rapsomaniki.webp" alt="">
              <figcaption>Marianna Rapsomaniki<span class="where">University of Lausanne</span></figcaption>
            </figure>
            <figure>
              <img src="../speakers/arjun-raj.jpg" alt="">
              <figcaption>Arjun Raj<span class="where">Cellular Intelligence</span></figcaption>
            </figure>
            <figure>
              <img src="../speakers/xinyi-zhang.jpg" alt="">
              <figcaption>Xinyi Zhang<span class="where">Aithyra</span></figcaption>
            </figure>
          </div>
        </div>

      </div>

      <div class="footline">
        <span><b>Paris</b> &middot; December 2026</span>
        <span>Data infrastructure &middot; Evaluations</span>
      </div>
    </div>
    <script>
      // build_og.sh renders this file twice, switching variant by query string.
      if (new URLSearchParams(location.search).get('variant') === 'lineup') {
        document.body.classList.add('lineup');
      }
    </script>
  </body>
</html>
