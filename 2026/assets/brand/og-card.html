<!doctype html>
<!-- Source for aidar-og.png. Rendered at exactly 1200x630 by build_og.sh.
     Edit here, re-run that script, never hand-edit the PNG. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      :root {
        --ink: #202124;
        --muted: #5f6368;
        --line: #d8dadd;
        --wash: #f7f8f8;
        --accent: #2f6f73;
        --accent-deep: #26595c;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; padding: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fff;
        color: var(--ink);
        font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      }

      /* The plate: a hairline frame inset from the trim, as a figure in a journal. */
      .plate {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 54px 64px;
        border: 1px solid var(--line);
        background:
          linear-gradient(180deg, #fff 0%, var(--wash) 100%);
        outline: 14px solid #fff;
        outline-offset: -14px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 360px;
        align-items: center;
        column-gap: 56px;
        height: 100%;
      }

      .kicker {
        margin: 0 0 22px;
        color: var(--accent);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .wordmark {
        margin: 0;
        font-size: 148px;
        font-weight: 400;
        line-height: 0.9;
        letter-spacing: -0.022em;
      }

      /* The lowercase a is the acronym's own signal: AI + Data + Readiness. */
      .wordmark .lower { font-style: italic; }

      .rule {
        width: 132px;
        height: 2px;
        margin: 26px 0 24px;
        background: var(--accent-deep);
      }

      .tagline {
        max-width: 15.5ch;
        margin: 0;
        color: var(--ink);
        font-size: 41px;
        line-height: 1.14;
        letter-spacing: -0.01em;
      }

      .footline {
        position: absolute;
        right: 64px;
        bottom: 48px;
        left: 64px;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 19px;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .footline b { color: var(--ink); font-weight: 700; }

      .mark { width: 360px; height: 360px; }
      .mark svg { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="plate">
      <div class="grid">
        <div>
          <p class="kicker">NeurIPS 2026 Workshop</p>
          <h1 class="wordmark">AID<span class="lower">a</span>R</h1>
          <div class="rule"></div>
          <p class="tagline">AI Data Readiness for Scientific Discovery</p>
        </div>
        <div class="mark" id="mark"></div>
      </div>
      <div class="footline">
        <span><b>Paris</b> &middot; December 2026</span>
        <span>Data infrastructure &middot; Evaluations</span>
      </div>
    </div>
    <script>
      // Inlined at build time so the PNG never depends on a second request.
      fetch('aidar-mark.svg')
        .then(r => r.text())
        .then(svg => { document.getElementById('mark').innerHTML = svg; });
    </script>
  </body>
</html>
