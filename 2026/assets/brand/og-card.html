<!doctype html>
<!-- Source for aidar-og.png. Rendered at exactly 1200x630 by build_og.sh.
     Edit here, re-run that script, never hand-edit the PNG. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      :root {
        --ink: #202124;
        --muted: #5f6368;
        --line: #d8dadd;
        --wash: #f7f8f8;
        --accent: #2f6f73;
        --accent-deep: #26595c;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; padding: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fff;
        color: var(--ink);
        font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      }

      /* The plate: a hairline frame inset from the trim, as a figure in a journal. */
      .plate {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 64px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, #fff 0%, var(--wash) 100%);
        outline: 14px solid #fff;
        outline-offset: -14px;
        text-align: center;
      }

      .kicker {
        margin: 0 0 30px;
        color: var(--accent);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      /* The lockup: the A is the Eiffel Tower, so the I beside it reads AI. */
      .wordmark {
        display: flex;
        align-items: baseline;
        justify-content: center;
        margin: 0;
        font-size: 172px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .wordmark .tower {
        display: block;
        width: 0.71em;
        height: 0.7em;      /* cap height of the following letters */
        margin-right: 0.008em;
      }

      .wordmark .tower img { display: block; width: 100%; height: 100%; }

      .wordmark .lower { font-style: italic; }

      .rule {
        width: 148px;
        height: 2px;
        margin: 34px 0 26px;
        background: var(--accent-deep);
      }

      .tagline {
        margin: 0;
        font-size: 40px;
        line-height: 1.15;
        letter-spacing: -0.01em;
      }

      .footline {
        position: absolute;
        right: 64px;
        bottom: 46px;
        left: 64px;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 19px;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .footline b { color: var(--ink); font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="plate">
      <p class="kicker">NeurIPS 2026 Workshop</p>
      <h1 class="wordmark">
        <span class="tower"><img src="aidar-a.svg" alt=""></span>ID<span class="lower">a</span>R
      </h1>
      <div class="rule"></div>
      <p class="tagline">AI Data Readiness for Scientific Discovery</p>
      <div class="footline">
        <span><b>Paris</b> &middot; December 2026</span>
        <span>Data infrastructure &middot; Evaluations</span>
      </div>
    </div>
  </body>
</html>
