<!doctype html>
<!-- Export wrapper for apple-touch-icon.png.
     Rendering the .svg URL directly lets Chrome scale it to the viewport and
     offset it by the default body margin, which silently clipped the mark off
     the right edge. Pinning the box to the viewport here makes the export
     deterministic. Sized in fixed pixels, not vw/vh: viewport units measured
     against a canvas that also has to hold the image scaled the mark and pushed
     it off the right edge, which check-avatar.html caught. Each export size gets
     its own wrapper. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      html, body { margin: 0; padding: 0; background: #fff; }
      body { width: 180px; height: 180px; overflow: hidden; }
      img { display: block; width: 180px; height: 180px; }
    </style>
  </head>
  <body>
    <img src="aidar-avatar.svg" alt="">
  </body>
</html>
