<!doctype html>
<!-- Source for aidar-linkedin-banner.jpg, rendered by build_og.sh at 2100x350
     and a 2x device scale, giving LinkedIn's recommended 4200x700.

     Type only. The wordmark moved into the Page logo, which is drawn over the
     cover at ~150px and is where a stranger looks to find out whose page this
     is — so the cover no longer needs to carry it, and nothing is said twice.
     What is left is the one thing the page title does not say (what AIDaR
     stands for) and the one thing worth repeating (where and when).

     LinkedIn's spec drives the rest: the cover "might be adjusted to fit the
     screen, which might trim the image horizontally or vertically", they ask
     for limited text, and key details belong away from the edges. The block
     sits clear of the left fifth, which the logo covers entirely.

     Edit here, re-run build_og.sh, never hand-edit the JPEG. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      :root {
        --ink: #202124;
        --muted: #5f6368;
        --line: #d8dadd;
        --wash: #f7f8f8;
        --accent: #2f6f73;
        --accent-deep: #26595c;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; padding: 0; }

      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2100px;
        height: 350px;
        overflow: hidden;
        background: linear-gradient(180deg, #fff 0%, var(--wash) 100%);
        color: var(--ink);
        font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      }

      /* Stacked rather than side by side, and nudged up off the lower edge.
         A side-by-side lockup is about 65% of the width, so a narrow-screen
         centre crop takes the tower-A off the front of the word and truncates
         the tagline. Stacked, the widest line is under half the width and the
         whole thing survives the crop. */

      .copy {
        position: absolute;
        left: 620px;
        top: 50%;
        transform: translateY(-50%);
        max-width: 1180px;
      }

      .title {
        margin: 0 0 24px;
        font-size: 92px;
        line-height: 1.08;
        letter-spacing: -0.016em;
      }

      .rule {
        width: 132px;
        height: 3px;
        margin: 0 0 24px;
        background: var(--accent-deep);
      }

      .det {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 29px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .det .sep { color: var(--line); margin: 0 14px; }
      .det .p { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="copy">
      <h1 class="title">AI Data Readiness<br>for Scientific Discovery</h1>
      <div class="rule"></div>
      <p class="det">NeurIPS 2026 Workshop<span class="sep">&middot;</span><span class="p">Paris &middot; December 2026</span></p>
    </div>
  </body>
</html>
