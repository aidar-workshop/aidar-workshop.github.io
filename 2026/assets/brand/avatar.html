<!doctype html>
<!-- Export wrapper for aidar-avatar.png.
     Rendering the .svg URL directly lets Chrome scale it to the viewport and
     offset it by the default body margin, which silently clipped the plate off
     the right edge. Pinning the box here makes the export deterministic. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      html, body { margin: 0; padding: 0; background: #fff; }
      body { width: 400px; height: 400px; overflow: hidden; }
      img { display: block; width: 400px; height: 400px; }
    </style>
  </head>
  <body>
    <img src="aidar-avatar.svg" alt="">
  </body>
</html>
